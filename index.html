<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FitAI Smart - AI-driven personal recommendation engine and fitness/nutrition assistant. Zero manual logging.">
  <meta name="theme-color" content="#090d16">
  <title>FitAI Smart</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">
  
  <!-- Root SPA Container -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Initial Loading Skeleton (Replaced immediately by app.js) -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center space-y-4">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-400 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-2xl shadow-xl shadow-emerald-500/20 animate-pulse">
        ⚡
      </div>
      <h1 class="text-xl font-extrabold text-white tracking-tight">FitAI Smart</h1>
      <p class="text-xs text-slate-400 font-mono">Initializing AI Recommendation Engine...</p>
    </div>
  </div>

  <noscript>
    <div class="p-6 text-center text-rose-400 bg-slate-900 rounded-xl m-4 border border-rose-500/30">
      JavaScript is required to run FitAI Smart. Please enable JavaScript in your browser settings.
    </div>
  </noscript>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
